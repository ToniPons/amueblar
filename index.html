<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f4a40" />
    <meta name="description" content="Apps — Amueblar, Parte y Gastos." />
    <title>Apps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/landing.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="hub">
      <h1 class="brand">Apps</h1>
      <nav class="app-grid" aria-label="Aplicaciones">
        <a class="app-tile" href="./amueblar/" style="--i: 0">
          <img class="app-tile__icon" src="./icons/amueblar.svg" alt="" width="96" height="96" decoding="async" />
          <span class="app-tile__name">Amueblar</span>
        </a>
        <a class="app-tile" href="./parte/" style="--i: 1">
          <img class="app-tile__icon" src="./icons/parte.svg" alt="" width="96" height="96" decoding="async" />
          <span class="app-tile__name">Parte</span>
        </a>
        <a class="app-tile" href="./gastos/" style="--i: 2">
          <img class="app-tile__icon" src="./icons/gastos.svg" alt="" width="96" height="96" decoding="async" />
          <span class="app-tile__name">Gastos</span>
        </a>
      </nav>
    </main>
  </body>
</html>
