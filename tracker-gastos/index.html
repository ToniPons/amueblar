<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15202b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Gastos" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Gastos — tracker de gastos personales offline" />
  <title>Gastos — Tracker de gastos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Young+Serif&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/app-switch.css" />
  <style>
    :root {
      --ink: #15202b;
      --ink-soft: #3d4a57;
      --muted: #6b7785;
      --line: rgba(21, 32, 43, 0.12);
      --surface: rgba(255, 255, 255, 0.82);
      --accent: #15202b;
      --coin: #c9922a;
      --coin-soft: rgba(201, 146, 42, 0.16);
      --danger: #a33b32;
      --ok: #2f6b52;
      --radius: 16px;
      --shadow: 0 16px 36px rgba(21, 32, 43, 0.08);
      --font-display: "Young Serif", Georgia, serif;
      --font-body: "DM Sans", "Segoe UI", sans-serif;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --dock-h: 72px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(1000px 520px at -5% -5%, rgba(201, 146, 42, 0.18), transparent 55%),
        radial-gradient(800px 480px at 110% 5%, rgba(70, 110, 140, 0.16), transparent 50%),
        linear-gradient(168deg, #e4e9ef 0%, #eef1f5 45%, #e8e4dc 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }
    body.sheet-open { overflow: hidden; touch-action: none; }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.4;
      background-image:
        radial-gradient(rgba(21, 32, 43, 0.05) 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent 75%);
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    img { max-width: 100%; display: block; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }

    .app {
      width: min(560px, 100%);
      margin: 0 auto;
      padding: calc(16px + var(--safe-t)) 16px calc(var(--dock-h) + 28px + var(--safe-b));
      position: relative;
      z-index: 1;
    }

    .hero {
      min-height: calc(100dvh - 170px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px 2px 24px;
      animation: rise 0.7s ease both;
    }
    .hero-mark {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(3.2rem, 14vw, 4.6rem);
      line-height: 0.94;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin: 0 0 16px;
    }
    .hero-mark span {
      display: block;
      font-size: 0.28em;
      font-family: var(--font-body);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--coin);
      margin-bottom: 10px;
    }
    .hero p {
      margin: 0 0 26px;
      max-width: 32ch;
      font-size: 1.05rem;
      line-height: 1.45;
      color: var(--ink-soft);
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 1.15rem;
      border-radius: 999px;
      font-weight: 650;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--accent);
      color: #f5f7fa;
      box-shadow: 0 10px 24px rgba(21, 32, 43, 0.22);
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--line);
      color: var(--ink);
    }
    .btn-danger {
      background: rgba(163, 59, 50, 0.1);
      color: var(--danger);
      width: 100%;
    }
    .btn-block { width: 100%; }

    .screen { display: none; animation: rise 0.45s ease both; }
    .screen.active { display: block; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 1rem;
    }
    .brand-mini {
      font-family: var(--font-display);
      font-size: 1.45rem;
      letter-spacing: -0.02em;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 0.75rem;
      border-radius: 999px;
      background: var(--coin-soft);
      color: #7a5a12;
      font-size: 0.82rem;
      font-weight: 650;
    }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 1rem;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--line);
    }
    .month-nav button {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      font-size: 1.1rem;
      color: var(--ink-soft);
    }
    .month-nav button:hover { background: rgba(21, 32, 43, 0.06); }
    .month-label {
      font-weight: 650;
      font-size: 0.95rem;
      text-transform: capitalize;
      letter-spacing: -0.01em;
    }

    .summary {
      display: grid;
      gap: 10px;
      margin-bottom: 1.1rem;
      animation: rise 0.55s ease both;
    }
    .summary-total {
      padding: 1.15rem 1.2rem;
      border-radius: calc(var(--radius) + 4px);
      background:
        linear-gradient(145deg, rgba(21, 32, 43, 0.96), rgba(36, 52, 68, 0.92));
      color: #f3f6f9;
      box-shadow: var(--shadow);
    }
    .summary-total .label {
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(243, 246, 249, 0.62);
      margin-bottom: 6px;
    }
    .summary-total .value {
      font-family: var(--font-display);
      font-size: clamp(2rem, 8vw, 2.6rem);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .summary-total .meta {
      margin-top: 10px;
      font-size: 0.88rem;
      color: rgba(243, 246, 249, 0.7);
    }
    .cats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .cat-pill {
      padding: 0.7rem 0.8rem;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    .cat-pill .name {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 2px;
    }
    .cat-pill .amt {
      font-weight: 700;
      font-size: 0.98rem;
      letter-spacing: -0.02em;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 0.85rem;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.5);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink-soft);
      white-space: nowrap;
    }
    .filter-btn.is-active {
      background: var(--ink);
      color: #f5f7fa;
      border-color: transparent;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .day-group { margin-bottom: 0.35rem; }
    .day-label {
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0.55rem 0 0.4rem 2px;
    }
    .expense-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      width: 100%;
      text-align: left;
      padding: 0.85rem 0.95rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 20px rgba(21, 32, 43, 0.04);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }
    .expense-card:active { transform: scale(0.99); }
    .expense-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--coin-soft);
      font-size: 1.15rem;
      line-height: 1;
    }
    .expense-main { min-width: 0; }
    .expense-main .title {
      font-weight: 650;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .expense-main .sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .expense-amt {
      font-weight: 700;
      font-size: 0.98rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      padding: 2.2rem 1rem;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.35);
    }
    .empty strong {
      display: block;
      color: var(--ink-soft);
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .dock {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(560px, 100%);
      padding: 12px 16px calc(12px + var(--safe-b));
      z-index: 20;
      background: linear-gradient(to top, rgba(238, 241, 245, 0.96) 40%, transparent);
      pointer-events: none;
    }
    .dock .btn { pointer-events: auto; width: 100%; }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(21, 32, 43, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 40;
    }
    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 110%);
      width: min(560px, 100%);
      max-height: min(92dvh, 720px);
      overflow: auto;
      background: #f7f8fa;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -20px 50px rgba(21, 32, 43, 0.18);
      z-index: 50;
      padding: 10px 16px calc(20px + var(--safe-b));
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .sheet.open { transform: translate(-50%, 0); }
    .sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: rgba(21, 32, 43, 0.18);
      margin: 4px auto 14px;
    }
    .sheet h2 {
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 400;
      margin: 0 0 1rem;
      letter-spacing: -0.02em;
    }
    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 0.85rem;
    }
    .field label {
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 48px;
      padding: 0.7rem 0.9rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .field textarea { min-height: 88px; resize: vertical; }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: rgba(201, 146, 42, 0.55);
      box-shadow: 0 0 0 3px var(--coin-soft);
    }
    .amount-input {
      font-family: var(--font-display);
      font-size: 1.8rem !important;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .cat-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 0.7rem 0.35rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 0.72rem;
      font-weight: 650;
      color: var(--ink-soft);
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .cat-option .ico { font-size: 1.2rem; }
    .cat-option.is-active {
      background: var(--ink);
      color: #f5f7fa;
      border-color: transparent;
    }
    .photo-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .photo-preview {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--line);
      background: #fff;
    }
    .photo-preview[hidden] { display: none; }
    .sheet-actions {
      display: grid;
      gap: 8px;
      margin-top: 0.5rem;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(88px + var(--safe-b));
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      padding: 0.65rem 1rem;
      border-radius: 999px;
      background: var(--ink);
      color: #f5f7fa;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: opacity 0.25s ease, transform 0.25s ease;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (min-width: 640px) {
      .app { padding-top: 28px; }
      .hero { min-height: 68dvh; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <nav class="app-switch" aria-label="Cambiar de aplicación">
      <a class="app-switch__item" href="../">Amueblar</a>
      <a class="app-switch__item" href="../parte/">Parte</a>
      <a class="app-switch__item is-active" href="./" aria-current="page">Gastos</a>
    </nav>

    <section class="screen active" id="screen-home" aria-label="Inicio">
      <div class="hero">
        <h1 class="hero-mark"><span>Control personal</span>Gastos</h1>
        <p>Anota cada gasto al momento. Totales del mes, por categoría, sin cuentas ni nube.</p>
        <div class="hero-actions">
          <button type="button" class="btn btn-primary" id="btn-start">Ver este mes</button>
          <button type="button" class="btn btn-ghost" id="btn-home-add">Añadir gasto</button>
        </div>
      </div>
    </section>

    <section class="screen" id="screen-list" aria-label="Listado">
      <div class="topbar">
        <div class="brand-mini">Gastos</div>
        <div class="chip" id="count-chip">0 movimientos</div>
      </div>

      <div class="month-nav" aria-label="Mes">
        <button type="button" id="btn-prev-month" aria-label="Mes anterior">‹</button>
        <div class="month-label" id="month-label">—</div>
        <button type="button" id="btn-next-month" aria-label="Mes siguiente">›</button>
      </div>

      <div class="summary" id="summary">
        <div class="summary-total">
          <div class="label">Total del mes</div>
          <div class="value" id="month-total">0,00 €</div>
          <div class="meta" id="month-meta">Sin gastos todavía</div>
        </div>
        <div class="cats" id="cat-breakdown"></div>
      </div>

      <div class="filters" id="filters" role="tablist" aria-label="Categoría"></div>
      <div class="list" id="expense-list"></div>
    </section>
  </div>

  <div class="dock" id="dock" hidden>
    <button type="button" class="btn btn-primary" id="btn-add">+ Nuevo gasto</button>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 id="sheet-title">Nuevo gasto</h2>
    <form id="expense-form" novalidate>
      <input type="hidden" id="expense-id" />
      <div class="field">
        <label for="expense-amount">Importe</label>
        <input class="amount-input" id="expense-amount" type="text" inputmode="decimal" placeholder="0,00" required autocomplete="off" />
      </div>
      <div class="field">
        <label>Categoría</label>
        <div class="cat-grid" id="cat-picker" role="radiogroup" aria-label="Categoría"></div>
        <input type="hidden" id="expense-category" value="comida" />
      </div>
      <div class="field">
        <label for="expense-note">Nota</label>
        <input id="expense-note" type="text" maxlength="120" placeholder="Café, metro, super…" autocomplete="off" />
      </div>
      <div class="field">
        <label for="expense-date">Fecha</label>
        <input id="expense-date" type="date" required />
      </div>
      <div class="field">
        <label>Ticket (opcional)</label>
        <div class="photo-row">
          <img class="photo-preview" id="photo-preview" alt="Vista previa del ticket" hidden />
          <button type="button" class="btn btn-ghost" id="btn-photo">Foto</button>
          <button type="button" class="btn btn-ghost" id="btn-clear-photo" hidden>Quitar</button>
        </div>
        <input type="file" id="photo-input" accept="image/*" capture="environment" class="sr-only" />
      </div>
      <div class="sheet-actions">
        <button type="submit" class="btn btn-primary btn-block" id="btn-save">Guardar</button>
        <button type="button" class="btn btn-danger" id="btn-delete" hidden>Eliminar</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
(function () {
  const STORAGE_KEY = "gastos-v1";
  const CATEGORIES = [
    { id: "comida", label: "Comida", icon: "🍽" },
    { id: "transporte", label: "Transporte", icon: "🚌" },
    { id: "casa", label: "Casa", icon: "🏠" },
    { id: "ocio", label: "Ocio", icon: "🎟" },
    { id: "salud", label: "Salud", icon: "✚" },
    { id: "compras", label: "Compras", icon: "🛍" },
    { id: "otros", label: "Otros", icon: "•" },
  ];
  const MONTHS = [
    "enero", "febrero", "marzo", "abril", "mayo", "junio",
    "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre",
  ];

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  const state = {
    expenses: load(),
    viewYear: new Date().getFullYear(),
    viewMonth: new Date().getMonth(),
    filterCat: "all",
    photoData: null,
    editingId: null,
  };

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.expenses));
  }

  function uid() {
    return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
  }

  function parseAmount(str) {
    if (typeof str !== "string") return NaN;
    const cleaned = str.trim().replace(/\s/g, "").replace(",", ".");
    const n = Number(cleaned);
    return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : NaN;
  }

  function formatEuro(n) {
    return new Intl.NumberFormat("es-ES", {
      style: "currency",
      currency: "EUR",
    }).format(n || 0);
  }

  function todayISO() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${d.getFullYear()}-${m}-${day}`;
  }

  function catById(id) {
    return CATEGORIES.find((c) => c.id === id) || CATEGORIES[CATEGORIES.length - 1];
  }

  function monthExpenses() {
    const y = state.viewYear;
    const m = state.viewMonth;
    return state.expenses
      .filter((e) => {
        const d = e.date || "";
        if (d.length < 7) return false;
        const [ey, em] = d.split("-").map(Number);
        return ey === y && em - 1 === m;
      })
      .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));
  }

  function showToast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.classList.remove("show"), 1800);
  }

  function showScreen(id) {
    $$(".screen").forEach((s) => s.classList.remove("active"));
    $(`#${id}`).classList.add("active");
    $("#dock").hidden = id !== "screen-list";
  }

  function openSheet(expense) {
    state.editingId = expense ? expense.id : null;
    state.photoData = expense?.photo || null;
    $("#sheet-title").textContent = expense ? "Editar gasto" : "Nuevo gasto";
    $("#expense-id").value = expense?.id || "";
    $("#expense-amount").value = expense ? String(expense.amount).replace(".", ",") : "";
    $("#expense-note").value = expense?.note || "";
    $("#expense-date").value = expense?.date || todayISO();
    $("#expense-category").value = expense?.category || "comida";
    $("#btn-delete").hidden = !expense;
    syncCatPicker();
    syncPhotoUI();
    const sheet = $("#sheet");
    const backdrop = $("#sheet-backdrop");
    sheet.hidden = false;
    backdrop.hidden = false;
    requestAnimationFrame(() => {
      sheet.classList.add("open");
      backdrop.classList.add("open");
      document.body.classList.add("sheet-open");
    });
    setTimeout(() => $("#expense-amount").focus(), 280);
  }

  function closeSheet() {
    const sheet = $("#sheet");
    const backdrop = $("#sheet-backdrop");
    sheet.classList.remove("open");
    backdrop.classList.remove("open");
    document.body.classList.remove("sheet-open");
    setTimeout(() => {
      sheet.hidden = true;
      backdrop.hidden = true;
      $("#expense-form").reset();
      state.photoData = null;
      state.editingId = null;
      syncPhotoUI();
    }, 280);
  }

  function syncCatPicker() {
    const active = $("#expense-category").value;
    $$(".cat-option").forEach((btn) => {
      btn.classList.toggle("is-active", btn.dataset.cat === active);
    });
  }

  function syncPhotoUI() {
    const preview = $("#photo-preview");
    const clearBtn = $("#btn-clear-photo");
    if (state.photoData) {
      preview.src = state.photoData;
      preview.hidden = false;
      clearBtn.hidden = false;
    } else {
      preview.removeAttribute("src");
      preview.hidden = true;
      clearBtn.hidden = true;
    }
  }

  function buildCatPicker() {
    const root = $("#cat-picker");
    root.innerHTML = CATEGORIES.map(
      (c) =>
        `<button type="button" class="cat-option" data-cat="${c.id}" role="radio" aria-checked="false">
          <span class="ico" aria-hidden="true">${c.icon}</span>
          <span>${c.label}</span>
        </button>`
    ).join("");
    root.addEventListener("click", (e) => {
      const btn = e.target.closest(".cat-option");
      if (!btn) return;
      $("#expense-category").value = btn.dataset.cat;
      syncCatPicker();
    });
  }

  function buildFilters(items) {
    const root = $("#filters");
    const counts = { all: items.length };
    CATEGORIES.forEach((c) => {
      counts[c.id] = items.filter((e) => e.category === c.id).length;
    });
    const tabs = [
      { id: "all", label: "Todos" },
      ...CATEGORIES.filter((c) => counts[c.id] > 0).map((c) => ({
        id: c.id,
        label: c.label,
      })),
    ];
    root.innerHTML = tabs
      .map(
        (t) =>
          `<button type="button" class="filter-btn${state.filterCat === t.id ? " is-active" : ""}" data-filter="${t.id}" role="tab" aria-selected="${state.filterCat === t.id}">${t.label}</button>`
      )
      .join("");
  }

  function render() {
    const items = monthExpenses();
    if (
      state.filterCat !== "all" &&
      !items.some((e) => e.category === state.filterCat)
    ) {
      state.filterCat = "all";
    }
    const filtered =
      state.filterCat === "all"
        ? items
        : items.filter((e) => e.category === state.filterCat);

    $("#month-label").textContent = `${MONTHS[state.viewMonth]} ${state.viewYear}`;
    $("#count-chip").textContent =
      items.length === 1 ? "1 movimiento" : `${items.length} movimientos`;

    const total = items.reduce((s, e) => s + (e.amount || 0), 0);
    $("#month-total").textContent = formatEuro(total);
    $("#month-meta").textContent = items.length
      ? `${items.length} gasto${items.length === 1 ? "" : "s"} · media ${formatEuro(total / items.length)}`
      : "Sin gastos todavía";

    const byCat = {};
    items.forEach((e) => {
      byCat[e.category] = (byCat[e.category] || 0) + (e.amount || 0);
    });
    const topCats = Object.entries(byCat)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 4);
    $("#cat-breakdown").innerHTML = topCats.length
      ? topCats
          .map(([id, amt]) => {
            const c = catById(id);
            return `<div class="cat-pill"><div class="name">${c.icon} ${c.label}</div><div class="amt">${formatEuro(amt)}</div></div>`;
          })
          .join("")
      : "";

    buildFilters(items);

    const list = $("#expense-list");
    if (!filtered.length) {
      list.innerHTML = `<div class="empty"><strong>Nada por aquí</strong>Añade el primer gasto de ${MONTHS[state.viewMonth]}.</div>`;
      return;
    }

    const groups = new Map();
    filtered.forEach((e) => {
      const key = e.date || "sin-fecha";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(e);
    });

    list.innerHTML = [...groups.entries()]
      .map(([date, rows]) => {
        const label = formatDayLabel(date);
        const cards = rows
          .map((e) => {
            const c = catById(e.category);
            const title = e.note?.trim() || c.label;
            return `<button type="button" class="expense-card" data-id="${e.id}">
              <span class="expense-icon" aria-hidden="true">${c.icon}</span>
              <span class="expense-main">
                <span class="title">${escapeHtml(title)}</span>
                <span class="sub">${c.label}${e.photo ? " · ticket" : ""}</span>
              </span>
              <span class="expense-amt">${formatEuro(e.amount)}</span>
            </button>`;
          })
          .join("");
        return `<div class="day-group"><div class="day-label">${label}</div>${cards}</div>`;
      })
      .join("");
  }

  function formatDayLabel(iso) {
    if (!iso || iso.length < 10) return "Sin fecha";
    const [y, m, d] = iso.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    const sameDay = (a, b) =>
      a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();
    if (sameDay(date, today)) return "Hoy";
    if (sameDay(date, yesterday)) return "Ayer";
    return date.toLocaleDateString("es-ES", {
      weekday: "short",
      day: "numeric",
      month: "short",
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("No se pudo leer la imagen"));
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const max = 1000;
          let { width, height } = img;
          if (width > max || height > max) {
            const scale = max / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.onerror = () => reject(new Error("Imagen inválida"));
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // Events
  $("#btn-start").addEventListener("click", () => {
    showScreen("screen-list");
    render();
  });
  $("#btn-home-add").addEventListener("click", () => {
    showScreen("screen-list");
    render();
    openSheet(null);
  });
  $("#btn-add").addEventListener("click", () => openSheet(null));
  $("#sheet-backdrop").addEventListener("click", closeSheet);
  $("#btn-prev-month").addEventListener("click", () => {
    if (state.viewMonth === 0) {
      state.viewMonth = 11;
      state.viewYear -= 1;
    } else {
      state.viewMonth -= 1;
    }
    state.filterCat = "all";
    render();
  });
  $("#btn-next-month").addEventListener("click", () => {
    if (state.viewMonth === 11) {
      state.viewMonth = 0;
      state.viewYear += 1;
    } else {
      state.viewMonth += 1;
    }
    state.filterCat = "all";
    render();
  });

  $("#filters").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-filter]");
    if (!btn) return;
    state.filterCat = btn.dataset.filter;
    render();
  });

  $("#expense-list").addEventListener("click", (e) => {
    const card = e.target.closest("[data-id]");
    if (!card) return;
    const expense = state.expenses.find((x) => x.id === card.dataset.id);
    if (expense) openSheet(expense);
  });

  $("#btn-photo").addEventListener("click", () => $("#photo-input").click());
  $("#btn-clear-photo").addEventListener("click", () => {
    state.photoData = null;
    $("#photo-input").value = "";
    syncPhotoUI();
  });
  $("#photo-input").addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      state.photoData = await compressImage(file);
      syncPhotoUI();
    } catch {
      showToast("No se pudo cargar la foto");
    }
  });

  $("#expense-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const amount = parseAmount($("#expense-amount").value);
    if (!Number.isFinite(amount) || amount <= 0) {
      showToast("Introduce un importe válido");
      $("#expense-amount").focus();
      return;
    }
    const date = $("#expense-date").value;
    if (!date) {
      showToast("Elige una fecha");
      return;
    }
    const payload = {
      id: state.editingId || uid(),
      amount,
      category: $("#expense-category").value || "otros",
      note: $("#expense-note").value.trim(),
      date,
      photo: state.photoData || null,
      createdAt: state.editingId
        ? state.expenses.find((x) => x.id === state.editingId)?.createdAt || Date.now()
        : Date.now(),
      updatedAt: Date.now(),
    };

    if (state.editingId) {
      state.expenses = state.expenses.map((x) =>
        x.id === state.editingId ? payload : x
      );
      showToast("Gasto actualizado");
    } else {
      state.expenses.unshift(payload);
      showToast("Gasto guardado");
    }
    save();

    const [y, m] = date.split("-").map(Number);
    state.viewYear = y;
    state.viewMonth = m - 1;
    closeSheet();
    render();
  });

  $("#btn-delete").addEventListener("click", () => {
    if (!state.editingId) return;
    if (!confirm("¿Eliminar este gasto?")) return;
    state.expenses = state.expenses.filter((x) => x.id !== state.editingId);
    save();
    closeSheet();
    render();
    showToast("Gasto eliminado");
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("#sheet").hidden) closeSheet();
  });

  buildCatPicker();
  syncCatPicker();

  // If there is already data, skip hero and go to list
  if (state.expenses.length) {
    showScreen("screen-list");
    render();
  }
})();
  </script>
</body>
</html>
