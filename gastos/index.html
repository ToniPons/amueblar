<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a3a36" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Gastos" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Controla cuánto quieres gastar esta semana, anota gastos al instante y mira si te pasaste y desde qué día." />
  <title>Tracker Gastos — presupuesto semanal</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/home-link.css" />
  <style>
    :root {
      --pine: #0a3a36;
      --ink: #102826;
      --kelp: #3dd68c;
      --seafoam: #c8efe0;
      --mist: #d9ebe4;
      --foam: #f3fbf7;
      --coral: #e85d4c;
      --sky-wash: #cfe4ef;
      --muted: #455b53;
      --radius: 1rem;
      --font-display: "Syne", system-ui, sans-serif;
      --font-body: "Figtree", system-ui, sans-serif;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --shadow: 0 20px 60px rgba(10, 58, 54, 0.08);
    }

    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--foam);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(900px 520px at 8% -8%, rgba(61, 214, 140, 0.22), transparent 55%),
        radial-gradient(800px 480px at 100% 0%, rgba(207, 228, 239, 0.55), transparent 50%),
        linear-gradient(168deg, #e8f6f0 0%, var(--foam) 48%, #e7f0ea 100%);
    }
    .atmosphere::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image: radial-gradient(rgba(16, 40, 38, 0.05) 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent 75%);
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(48rem, 100%);
      margin: 0 auto;
      padding: calc(0.85rem + var(--safe-t)) 1rem calc(5.5rem + var(--safe-b));
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      min-height: 100dvh;
    }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .brand-mini {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .week-chip {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 650;
      color: color-mix(in oklab, var(--pine) 75%, transparent);
      white-space: nowrap;
    }

    .progress-block { animation: rise 0.45s ease both; }
    .progress-block .status {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.45rem, 5vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--pine);
    }
    .progress-block .status.is-over { color: var(--coral); }
    .progress-block .meta {
      margin: 0.35rem 0 0;
      font-size: 0.95rem;
      color: color-mix(in oklab, var(--ink) 55%, transparent);
    }
    .bar {
      margin-top: 0.9rem;
      height: 0.7rem;
      width: min(100%, 24rem);
      border-radius: 999px;
      background: color-mix(in oklab, var(--ink) 8%, transparent);
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--pine), var(--kelp));
      transition: width 0.35s ease;
    }
    .bar.is-over > span { background: linear-gradient(90deg, #b93b2f, var(--coral)); }

    .panel {
      border-radius: 1.75rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      padding: 1.25rem;
      animation: rise 0.55s ease both;
    }
    @media (min-width: 640px) { .panel { padding: 1.5rem; } }

    .panel h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.65rem;
      letter-spacing: -0.02em;
    }
    .field { display: grid; gap: 0.4rem; margin-bottom: 0.9rem; }
    .field label {
      font-size: 0.875rem;
      font-weight: 600;
      color: color-mix(in oklab, var(--ink) 70%, transparent);
    }
    .money-wrap { position: relative; }
    .money-wrap .euro {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: color-mix(in oklab, var(--ink) 35%, transparent);
      pointer-events: none;
    }
    .money-wrap input {
      width: 100%;
      height: 3.5rem;
      padding: 0 1rem 0 2.6rem;
      border-radius: 1rem;
      border: 1px solid color-mix(in oklab, var(--ink) 10%, transparent);
      background: rgba(255, 255, 255, 0.75);
      font-size: 1.5rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      outline: none;
    }
    .money-wrap.lg input {
      height: 4rem;
      font-size: 1.9rem;
      padding-left: 2.8rem;
    }
    .money-wrap .euro.lg { font-size: 1.9rem; }
    .money-wrap input:focus {
      border-color: color-mix(in oklab, var(--pine) 45%, transparent);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--kelp) 35%, transparent);
    }
    input[type="date"],
    input[type="text"] {
      width: 100%;
      height: 2.75rem;
      padding: 0 0.9rem;
      border-radius: 0.85rem;
      border: 1px solid color-mix(in oklab, var(--ink) 10%, transparent);
      background: rgba(255, 255, 255, 0.75);
      outline: none;
    }
    input[type="date"]:focus,
    input[type="text"]:focus {
      border-color: color-mix(in oklab, var(--pine) 45%, transparent);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--kelp) 35%, transparent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: 0 1.15rem;
      border-radius: 1rem;
      font-weight: 650;
      transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; pointer-events: none; }
    .btn-primary {
      background: var(--pine);
      color: var(--foam);
    }
    .btn-primary:hover { background: color-mix(in oklab, var(--pine) 90%, black); }
    .btn-kelp {
      background: var(--kelp);
      color: var(--pine);
    }
    .btn-kelp:hover { background: color-mix(in oklab, var(--kelp) 88%, black); }
    .btn-ghost {
      background: transparent;
      color: color-mix(in oklab, var(--pine) 75%, transparent);
      text-decoration: underline;
      text-underline-offset: 4px;
      min-height: auto;
      padding: 0.25rem 0;
      border-radius: 0;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .btn-danger-text {
      color: color-mix(in oklab, var(--ink) 40%, transparent);
      font-size: 0.8rem;
      font-weight: 600;
    }
    .btn-danger-text:hover { color: var(--coral); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 0.65rem; align-items: center; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .chip {
      min-height: 2.35rem;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      background: var(--mist);
      color: color-mix(in oklab, var(--ink) 75%, transparent);
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease;
    }
    .chip:active { transform: scale(0.97); }
    .chip.is-active {
      background: var(--pine);
      color: var(--foam);
    }

    .alert {
      margin: 0 0 0.75rem;
      font-size: 0.9rem;
      color: var(--coral);
    }
    .banner {
      margin: 0;
      padding: 0.85rem 1rem;
      border-radius: 1rem;
      background: color-mix(in oklab, var(--kelp) 22%, white);
      color: var(--pine);
      font-size: 0.92rem;
      font-weight: 600;
      animation: rise 0.4s ease both;
    }
    .banner.warn {
      background: color-mix(in oklab, var(--coral) 16%, white);
      color: #8a2f25;
    }

    .report-grid {
      display: grid;
      gap: 1rem;
    }
    @media (min-width: 640px) {
      .report-grid { grid-template-columns: 1fr 1fr; }
    }
    .stat-card {
      border-radius: 1.15rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.5);
      padding: 1.15rem;
    }
    .stat-card .label {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: color-mix(in oklab, var(--ink) 50%, transparent);
    }
    .stat-card .value {
      margin: 0.4rem 0 0;
      font-family: var(--font-display);
      font-size: 1.55rem;
      letter-spacing: -0.02em;
    }
    .stat-card .value.bad { color: var(--coral); }
    .stat-card .value.ok { color: var(--pine); }
    .stat-card .sub {
      margin: 0.35rem 0 0;
      font-size: 0.88rem;
      color: color-mix(in oklab, var(--ink) 55%, transparent);
    }

    .cat-list, .day-list, .expense-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .cat-list li, .day-list li {
      display: grid;
      gap: 0.25rem;
      padding: 0.55rem 0;
    }
    .cat-list li + li, .day-list li + li {
      border-top: 1px solid color-mix(in oklab, var(--ink) 8%, transparent);
    }
    .row-top {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: baseline;
    }
    .row-top strong { font-weight: 650; }
    .row-top .amt { font-variant-numeric: tabular-nums; font-weight: 700; }
    .mini-bar {
      height: 0.35rem;
      border-radius: 999px;
      background: color-mix(in oklab, var(--ink) 8%, transparent);
      overflow: hidden;
    }
    .mini-bar > span {
      display: block;
      height: 100%;
      background: var(--pine);
      border-radius: inherit;
      min-width: 4%;
    }
    .day-list li.is-breach {
      background: color-mix(in oklab, var(--coral) 8%, transparent);
      margin: 0 -0.5rem;
      padding-left: 0.5rem;
      padding-right: 0.5rem;
      border-radius: 0.6rem;
    }
    .day-list li.is-today strong::after {
      content: " · hoy";
      font-weight: 500;
      color: color-mix(in oklab, var(--pine) 70%, transparent);
      font-size: 0.82em;
    }

    .expense-list { border-top: 1px solid color-mix(in oklab, var(--ink) 8%, transparent); }
    .expense-list li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem 0.75rem;
      align-items: center;
      padding: 0.85rem 0;
      border-bottom: 1px solid color-mix(in oklab, var(--ink) 8%, transparent);
    }
    .expense-list .title { font-weight: 650; }
    .expense-list .sub {
      font-size: 0.82rem;
      color: color-mix(in oklab, var(--ink) 50%, transparent);
      margin-top: 0.15rem;
    }
    .expense-list .amt {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .expense-list .actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 0.85rem;
    }

    .empty {
      margin: 0;
      padding: 1.75rem 1rem;
      text-align: center;
      border: 1px dashed color-mix(in oklab, var(--ink) 15%, transparent);
      border-radius: 1.15rem;
      background: rgba(255, 255, 255, 0.4);
      color: color-mix(in oklab, var(--ink) 55%, transparent);
    }

    .section-title {
      margin: 0 0 0.75rem;
      font-family: var(--font-display);
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }

    footer.app-foot {
      margin-top: auto;
      padding-top: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 1rem;
    }

    .fab {
      position: fixed;
      right: max(1rem, env(safe-area-inset-right, 0px));
      bottom: calc(1rem + var(--safe-b));
      z-index: 30;
      width: 3.6rem;
      height: 3.6rem;
      border-radius: 999px;
      background: var(--pine);
      color: var(--foam);
      box-shadow: 0 12px 28px rgba(10, 58, 54, 0.28);
      display: grid;
      place-items: center;
      font-size: 2rem;
      font-weight: 500;
      line-height: 1;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .fab:active { transform: scale(0.96); }
    .fab[hidden] { display: none; }
    .fab svg { width: 1.55rem; height: 1.55rem; display: block; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(1.25rem + var(--safe-b));
      transform: translateX(-50%) translateY(16px);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      padding: 0.7rem 1.1rem;
      border-radius: 999px;
      background: var(--pine);
      color: var(--foam);
      font-size: 0.9rem;
      font-weight: 650;
      box-shadow: var(--shadow);
      transition: opacity 0.22s ease, transform 0.22s ease;
      white-space: nowrap;
      max-width: calc(100vw - 2rem);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(16, 40, 38, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 40;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 110%);
      width: min(32rem, 100%);
      max-height: min(90dvh, 640px);
      overflow: auto;
      background: #f6fefb;
      border-radius: 1.35rem 1.35rem 0 0;
      box-shadow: 0 -18px 50px rgba(10, 58, 54, 0.18);
      z-index: 50;
      padding: 0.65rem 1.15rem calc(1.25rem + var(--safe-b));
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .sheet.open { transform: translate(-50%, 0); }
    .sheet-handle {
      width: 2.5rem;
      height: 0.25rem;
      border-radius: 999px;
      background: color-mix(in oklab, var(--ink) 18%, transparent);
      margin: 0.25rem auto 1rem;
    }
    .sheet h2 {
      margin: 0 0 1rem;
      font-family: var(--font-display);
      font-size: 1.45rem;
    }
    body.sheet-open { overflow: hidden; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="app">
    <a class="home-link" href="../">Apps</a>

    <header>
      <div class="topbar">
        <h1 class="brand-mini">Gastos</h1>
        <p class="week-chip" id="week-label">Semana actual</p>
      </div>
      <div class="progress-block" id="progress-block" hidden>
        <p class="status" id="progress-status"></p>
        <p class="meta" id="progress-meta"></p>
        <div class="bar" id="progress-bar" aria-hidden="true"><span id="progress-fill"></span></div>
      </div>
      <p class="banner" id="week-rollover" hidden></p>
    </header>

    <section class="panel" aria-label="Presupuesto semanal" id="budget-section">
      <h2 class="section-title" id="budget-heading">Tope semanal</h2>
      <form id="budget-form">
        <div class="field">
          <label class="sr-only" for="budget-input">Tope semanal</label>
          <div class="money-wrap">
            <span class="euro" aria-hidden="true">€</span>
            <input id="budget-input" inputmode="decimal" placeholder="200" autocomplete="off" required />
          </div>
        </div>
        <p class="alert" id="budget-error" hidden></p>
        <div class="btn-row">
          <button type="submit" class="btn btn-kelp" id="budget-submit">Fijar</button>
        </div>
      </form>
    </section>

    <section aria-label="Informe semanal">
      <h2 class="section-title">Informe</h2>
      <div id="report-empty" class="empty" hidden>Fija un tope para ver el informe.</div>
      <div id="report-body" hidden>
        <div class="report-grid" style="margin-bottom:1rem">
          <div class="stat-card">
            <p class="label">Estado</p>
            <p class="value" id="stat-status"></p>
            <p class="sub" id="stat-spent"></p>
          </div>
          <div class="stat-card">
            <p class="label">Se agotó</p>
            <p class="value" id="stat-ranout"></p>
          </div>
        </div>

        <div class="panel" style="margin-bottom:1rem" id="cat-panel" hidden>
          <h3 class="section-title" style="font-size:1.15rem">Por categoría</h3>
          <ul class="cat-list" id="cat-list"></ul>
        </div>

        <div class="panel" style="margin-bottom:1rem" id="day-panel" hidden>
          <h3 class="section-title" style="font-size:1.15rem">Por día</h3>
          <ul class="day-list" id="day-list"></ul>
        </div>

        <div class="panel" id="list-panel" hidden>
          <h3 class="section-title" style="font-size:1.15rem">Gastos</h3>
          <ul class="expense-list" id="expense-list"></ul>
        </div>
      </div>
    </section>

    <footer class="app-foot">
      <button type="button" class="btn-ghost" id="btn-edit-budget" hidden>Cambiar tope</button>
      <button type="button" class="btn-ghost" id="btn-reset">Reiniciar semana</button>
    </footer>
  </div>

  <button type="button" class="fab" id="fab-add" aria-label="Añadir gasto" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
      <path d="M12 5v14M5 12h14" />
    </svg>
  </button>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>

  <div class="sheet" id="add-sheet" role="dialog" aria-modal="true" aria-labelledby="add-title" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 id="add-title">Nuevo gasto</h2>
    <form id="expense-form">
      <div class="field">
        <label for="expense-amount">Importe</label>
        <div class="money-wrap lg">
          <span class="euro lg" aria-hidden="true">€</span>
          <input id="expense-amount" inputmode="decimal" placeholder="0,00" autocomplete="off" />
        </div>
      </div>
      <div class="field">
        <label id="cat-label">Categoría</label>
        <div class="chips" id="cat-chips" role="group" aria-labelledby="cat-label"></div>
      </div>
      <div class="field">
        <label for="expense-note">Nota</label>
        <input id="expense-note" type="text" maxlength="120" placeholder="Café, metro…" autocomplete="off" />
      </div>
      <div class="field">
        <label for="expense-date">Fecha</label>
        <input id="expense-date" type="date" />
      </div>
      <p class="alert" id="expense-error" hidden></p>
      <button type="submit" class="btn btn-primary" id="expense-submit" style="width:100%">Añadir</button>
    </form>
  </div>

  <div class="sheet" id="edit-sheet" role="dialog" aria-modal="true" aria-labelledby="edit-title" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 id="edit-title">Editar gasto</h2>
    <form id="edit-form">
      <input type="hidden" id="edit-id" />
      <div class="field">
        <label for="edit-amount">Importe</label>
        <div class="money-wrap">
          <span class="euro" aria-hidden="true">€</span>
          <input id="edit-amount" inputmode="decimal" required />
        </div>
      </div>
      <div class="field">
        <label for="edit-category">Categoría</label>
        <select id="edit-category" style="width:100%;height:2.75rem;border-radius:0.85rem;border:1px solid color-mix(in oklab, var(--ink) 10%, transparent);padding:0 0.75rem;background:#fff"></select>
      </div>
      <div class="field">
        <label for="edit-note">Nota</label>
        <input id="edit-note" type="text" maxlength="120" />
      </div>
      <div class="field">
        <label for="edit-date">Fecha</label>
        <input id="edit-date" type="date" required />
      </div>
      <p class="alert" id="edit-error" hidden></p>
      <div class="btn-row" style="margin-top:0.5rem">
        <button type="submit" class="btn btn-primary" style="flex:1">Guardar</button>
        <button type="button" class="btn btn-ghost" id="edit-cancel">Cancelar</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
(function () {
  const STORAGE_KEY = "tracker-gastos-v1";
  const ARCHIVE_KEY = "tracker-gastos-archive-v1";
  const CATEGORIES = [
    { id: "comida", label: "Comida" },
    { id: "transporte", label: "Transporte" },
    { id: "hogar", label: "Hogar" },
    { id: "ocio", label: "Ocio" },
    { id: "salud", label: "Salud" },
    { id: "otros", label: "Otros" },
  ];
  const DAY_NAMES = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  const MONTHS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

  const $ = (sel, root = document) => root.querySelector(sel);

  /** Monday 00:00 local */
  function startOfWeek(d = new Date()) {
    const t = new Date(d);
    t.setHours(0, 0, 0, 0);
    const day = t.getDay();
    t.setDate(t.getDate() + (day === 0 ? -6 : 1 - day));
    return t;
  }
  function endOfWeek(d = new Date()) {
    const t = startOfWeek(d);
    t.setDate(t.getDate() + 6);
    t.setHours(23, 59, 59, 999);
    return t;
  }
  /** ISO-like week id: YYYY-Www (Monday-based, compatible with previous app intent) */
  function weekId(d = new Date()) {
    const monday = startOfWeek(d);
    const year = monday.getFullYear();
    const jan1 = new Date(year, 0, 1);
    const week = Math.ceil(((monday - jan1) / 86400000 + jan1.getDay() + 1) / 7);
    return `${year}-W${String(week).padStart(2, "0")}`;
  }
  function dateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function weekLabel(d = new Date()) {
    const a = startOfWeek(d);
    const b = endOfWeek(d);
    if (a.getMonth() === b.getMonth()) {
      return `${a.getDate()}–${b.getDate()} ${MONTHS[b.getMonth()]}`;
    }
    return `${a.getDate()} ${MONTHS[a.getMonth()]} – ${b.getDate()} ${MONTHS[b.getMonth()]}`;
  }
  function parseAmount(raw) {
    if (typeof raw !== "string") return NaN;
    let s = raw.trim().replace(/\s/g, "").replace(/€/g, "");
    if (!s) return NaN;
    if (s.includes(",") && s.includes(".")) {
      // 1.234,56 → 1234.56
      s = s.replace(/\./g, "").replace(",", ".");
    } else {
      s = s.replace(",", ".");
    }
    const n = Number(s);
    return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN;
  }
  function formatEuro(n) {
    return new Intl.NumberFormat("es-ES", {
      style: "currency",
      currency: "EUR",
      maximumFractionDigits: n % 1 !== 0 ? 2 : 0,
    }).format(n || 0);
  }
  function uid() {
    if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
    return `exp-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
  }
  function catLabel(id) {
    return CATEGORIES.find((c) => c.id === id)?.label || id;
  }
  function emptyState() {
    return { weekId: weekId(), budget: null, expenses: [] };
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { state: emptyState(), rolled: false };
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object") return { state: emptyState(), rolled: false };
      const current = weekId();
      if (parsed.weekId !== current) {
        // Archive previous week before wiping
        try {
          const archive = JSON.parse(localStorage.getItem(ARCHIVE_KEY) || "[]");
          if (Array.isArray(archive) && parsed.weekId) {
            archive.unshift({
              weekId: parsed.weekId,
              budget: parsed.budget,
              expenses: parsed.expenses || [],
              archivedAt: new Date().toISOString(),
            });
            localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive.slice(0, 12)));
          }
        } catch { /* ignore */ }
        return { state: emptyState(), rolled: true, prevWeekId: parsed.weekId };
      }
      return {
        state: {
          weekId: parsed.weekId,
          budget:
            typeof parsed.budget === "number" && Number.isFinite(parsed.budget)
              ? parsed.budget
              : null,
          expenses: Array.isArray(parsed.expenses) ? parsed.expenses : [],
        },
        rolled: false,
      };
    } catch {
      return { state: emptyState(), rolled: false };
    }
  }

  function save(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function buildReport(state) {
    const budget = state.budget;
    const expenses = [...state.expenses].sort(
      (a, b) => new Date(a.createdAt) - new Date(b.createdAt)
    );
    const totalSpent = expenses.reduce((s, e) => s + (e.amount || 0), 0);
    const remaining = budget == null ? 0 : budget - totalSpent;
    const exceeded = budget != null && totalSpent > budget;

    const monday = startOfWeek();
    const todayKey = dateKey(new Date());
    const byDay = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const key = dateKey(d);
      const spent = expenses
        .filter((e) => dateKey(new Date(e.createdAt)) === key)
        .reduce((s, e) => s + e.amount, 0);
      return {
        dateKey: key,
        label: `${DAY_NAMES[d.getDay()]} ${d.getDate()}`,
        spent,
        cumulative: 0,
        isToday: key === todayKey,
      };
    });
    let cum = 0;
    for (const day of byDay) {
      cum += day.spent;
      day.cumulative = cum;
    }
    let ranOutOn = null;
    if (budget != null && budget > 0) {
      ranOutOn =
        byDay.find((d) => d.cumulative >= budget && d.spent > 0) ||
        (totalSpent >= budget ? byDay.find((d) => d.cumulative >= budget) || null : null);
    }

    const map = new Map();
    for (const e of expenses) {
      const cur = map.get(e.category) || { total: 0, count: 0 };
      cur.total += e.amount;
      cur.count += 1;
      map.set(e.category, cur);
    }
    const byCategory = CATEGORIES.map((c) => {
      const cur = map.get(c.id) || { total: 0, count: 0 };
      return {
        category: c.id,
        label: c.label,
        total: cur.total,
        count: cur.count,
        share: totalSpent > 0 ? cur.total / totalSpent : 0,
      };
    }).filter((c) => c.count > 0);

    return {
      totalSpent,
      remaining,
      exceeded,
      budget,
      ranOutOn,
      byDay,
      byCategory,
      expensesNewest: [...expenses].reverse(),
    };
  }

  // —— State ——
  const loaded = load();
  let state = loaded.state;
  let selectedCat = "comida";

  // —— DOM ——
  const weekLabelEl = $("#week-label");
  const progressBlock = $("#progress-block");
  const progressStatus = $("#progress-status");
  const progressMeta = $("#progress-meta");
  const progressBar = $("#progress-bar");
  const progressFill = $("#progress-fill");
  const weekRollover = $("#week-rollover");
  const budgetSection = $("#budget-section");
  const budgetInput = $("#budget-input");
  const budgetError = $("#budget-error");
  const budgetSubmit = $("#budget-submit");
  const budgetHeading = $("#budget-heading");
  const btnEditBudget = $("#btn-edit-budget");
  const expenseForm = $("#expense-form");
  const expenseAmount = $("#expense-amount");
  const expenseNote = $("#expense-note");
  const expenseDate = $("#expense-date");
  const expenseError = $("#expense-error");
  const expenseSubmit = $("#expense-submit");
  const fabAdd = $("#fab-add");
  const addSheet = $("#add-sheet");
  const editSheet = $("#edit-sheet");
  const sheetBackdrop = $("#sheet-backdrop");
  const catChips = $("#cat-chips");
  const reportEmpty = $("#report-empty");
  const reportBody = $("#report-body");
  const toastEl = $("#toast");
  let budgetCollapsed = false;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 1800);
  }

  function weekBoundsISO() {
    return { min: dateKey(startOfWeek()), max: dateKey(endOfWeek()) };
  }

  function syncDateInputs() {
    const { min, max } = weekBoundsISO();
    expenseDate.min = min;
    expenseDate.max = max;
    if (!expenseDate.value || expenseDate.value < min || expenseDate.value > max) {
      expenseDate.value = dateKey(new Date());
    }
    const editDate = $("#edit-date");
    if (editDate) {
      editDate.min = min;
      editDate.max = max;
    }
  }

  function renderChips() {
    catChips.innerHTML = CATEGORIES.map(
      (c) =>
        `<button type="button" class="chip${selectedCat === c.id ? " is-active" : ""}" data-cat="${c.id}" aria-pressed="${selectedCat === c.id}">${c.label}</button>`
    ).join("");
  }

  function openSheet(sheet) {
    sheetBackdrop.hidden = false;
    sheet.hidden = false;
    requestAnimationFrame(() => {
      sheetBackdrop.classList.add("open");
      sheet.classList.add("open");
      document.body.classList.add("sheet-open");
    });
  }

  function closeSheets() {
    [addSheet, editSheet].forEach((sheet) => sheet.classList.remove("open"));
    sheetBackdrop.classList.remove("open");
    document.body.classList.remove("sheet-open");
    setTimeout(() => {
      addSheet.hidden = true;
      editSheet.hidden = true;
      sheetBackdrop.hidden = true;
    }, 280);
  }

  function openAddSheet() {
    if (state.budget == null || state.budget <= 0) {
      toast("Fija un tope primero");
      budgetSection.scrollIntoView({ behavior: "smooth", block: "center" });
      budgetInput.focus();
      return;
    }
    expenseError.hidden = true;
    syncDateInputs();
    renderChips();
    openSheet(addSheet);
    setTimeout(() => expenseAmount.focus(), 280);
  }

  function render() {
    const report = buildReport(state);
    const hasBudget = report.budget != null && report.budget > 0;
    weekLabelEl.textContent = weekLabel();

    if (hasBudget) {
      budgetInput.value = String(report.budget).replace(".", ",");
      budgetSubmit.textContent = "Guardar";
      budgetHeading.textContent = "Tope semanal";
      budgetSection.hidden = budgetCollapsed;
      btnEditBudget.hidden = !budgetCollapsed;
    } else {
      budgetCollapsed = false;
      budgetSection.hidden = false;
      btnEditBudget.hidden = true;
      budgetSubmit.textContent = "Fijar";
      budgetHeading.textContent = "Tope semanal";
    }

    fabAdd.hidden = false;

    // Progress
    if (hasBudget) {
      progressBlock.hidden = false;
      const pct = Math.min(1, report.totalSpent / report.budget);
      progressStatus.textContent = report.exceeded
        ? `Te pasaste ${formatEuro(Math.abs(report.remaining))}`
        : `Quedan ${formatEuro(report.remaining)}`;
      progressStatus.classList.toggle("is-over", report.exceeded);
      progressMeta.textContent = `${formatEuro(report.totalSpent)} de ${formatEuro(report.budget)}`;
      progressFill.style.width = `${Math.round(pct * 100)}%`;
      progressBar.classList.toggle("is-over", report.exceeded);
      progressBar.setAttribute("aria-label", "Progreso del presupuesto semanal");
    } else {
      progressBlock.hidden = true;
    }

    expenseSubmit.disabled = !hasBudget;

    // Report
    if (!hasBudget) {
      reportEmpty.hidden = false;
      reportBody.hidden = true;
    } else {
      reportEmpty.hidden = true;
      reportBody.hidden = false;

      const statusEl = $("#stat-status");
      statusEl.textContent = report.exceeded
        ? "Sí, te pasaste"
        : report.totalSpent === 0
          ? "Aún sin gastos"
          : "Vas dentro del tope";
      statusEl.className = `value ${report.exceeded ? "bad" : "ok"}`;
      $("#stat-spent").textContent = `${formatEuro(report.totalSpent)} / ${formatEuro(report.budget)}`;

      if (report.ranOutOn) {
        $("#stat-ranout").textContent = report.ranOutOn.label;
        $("#stat-ranout").className = "value bad";
      } else {
        $("#stat-ranout").textContent = "—";
        $("#stat-ranout").className = "value ok";
      }

      const catPanel = $("#cat-panel");
      if (report.byCategory.length) {
        catPanel.hidden = false;
        $("#cat-list").innerHTML = report.byCategory
          .map(
            (c) => `<li>
              <div class="row-top"><strong>${c.label}</strong><span class="amt">${formatEuro(c.total)}</span></div>
              <div class="sub" style="font-size:0.8rem;color:var(--muted)">${c.count} ${c.count === 1 ? "gasto" : "gastos"}</div>
              <div class="mini-bar"><span style="width:${Math.max(4, Math.round(c.share * 100))}%"></span></div>
            </li>`
          )
          .join("");
      } else {
        catPanel.hidden = true;
      }

      const dayPanel = $("#day-panel");
      const hasDaySpend = report.byDay.some((d) => d.spent > 0);
      if (hasDaySpend) {
        dayPanel.hidden = false;
        $("#day-list").innerHTML = report.byDay
          .map((d) => {
            const breach =
              report.budget != null &&
              d.cumulative >= report.budget &&
              (d.spent > 0 || report.ranOutOn?.dateKey === d.dateKey);
            return `<li class="${breach ? "is-breach" : ""} ${d.isToday ? "is-today" : ""}">
              <div class="row-top"><strong>${d.label}</strong><span class="amt">${formatEuro(d.spent)}</span></div>
              <div class="sub" style="font-size:0.8rem;color:var(--muted)">Acumulado ${formatEuro(d.cumulative)}</div>
            </li>`;
          })
          .join("");
      } else {
        dayPanel.hidden = true;
      }

      const listPanel = $("#list-panel");
      if (report.expensesNewest.length) {
        listPanel.hidden = false;
        $("#expense-list").innerHTML = report.expensesNewest
          .map((e) => {
            const d = new Date(e.createdAt);
            const when = `${DAY_NAMES[d.getDay()]} ${d.getDate()}`;
            const title = e.note?.trim() || catLabel(e.category);
            return `<li data-id="${e.id}">
              <div>
                <div class="title">${escapeHtml(title)}</div>
                <div class="sub">${catLabel(e.category)} · ${when}</div>
              </div>
              <div class="amt">${formatEuro(e.amount)}</div>
              <div class="actions">
                <button type="button" class="btn-ghost" data-edit="${e.id}">Editar</button>
                <button type="button" class="btn-danger-text" data-remove="${e.id}">Quitar</button>
              </div>
            </li>`;
          })
          .join("");
      } else {
        listPanel.hidden = true;
      }
    }

    renderChips();
    syncDateInputs();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // —— Events ——
  catChips.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-cat]");
    if (!btn) return;
    selectedCat = btn.dataset.cat;
    renderChips();
  });

  $("#budget-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const amount = parseAmount(budgetInput.value);
    if (!Number.isFinite(amount) || amount <= 0) {
      budgetError.hidden = false;
      budgetError.textContent = "Introduce un presupuesto semanal válido.";
      budgetInput.focus();
      return;
    }
    budgetError.hidden = true;
    const wasSet = state.budget != null;
    state = { ...state, budget: amount };
    save(state);
    budgetCollapsed = true;
    render();
    toast(wasSet ? "Tope actualizado" : "Tope fijado");
  });

  btnEditBudget.addEventListener("click", () => {
    budgetCollapsed = false;
    render();
    budgetSection.scrollIntoView({ behavior: "smooth", block: "center" });
    budgetInput.focus();
  });

  fabAdd.addEventListener("click", openAddSheet);

  expenseForm.addEventListener("submit", (e) => {
    e.preventDefault();
    if (state.budget == null) return;
    const amount = parseAmount(expenseAmount.value);
    if (!Number.isFinite(amount) || amount <= 0) {
      expenseError.hidden = false;
      expenseError.textContent = "Pon un importe válido.";
      expenseAmount.focus();
      return;
    }
    if (!selectedCat) {
      expenseError.hidden = false;
      expenseError.textContent = "Elige una categoría.";
      return;
    }
    const { min, max } = weekBoundsISO();
    let day = expenseDate.value || dateKey(new Date());
    if (day < min || day > max) {
      expenseError.hidden = false;
      expenseError.textContent = "La fecha debe estar en esta semana.";
      return;
    }
    expenseError.hidden = true;

    // Stamp time as noon local to avoid TZ day shifts
    const createdAt = new Date(`${day}T12:00:00`).toISOString();
    const note = expenseNote.value.trim();
    const expense = {
      id: uid(),
      amount,
      category: selectedCat,
      note: note || undefined,
      createdAt,
    };
    state = { ...state, expenses: [expense, ...state.expenses] };
    save(state);
    expenseAmount.value = "";
    expenseNote.value = "";
    expenseDate.value = dateKey(new Date());
    closeSheets();
    render();
    toast("Gasto añadido");
  });

  $("#expense-list").addEventListener("click", (e) => {
    const removeBtn = e.target.closest("[data-remove]");
    if (removeBtn) {
      const id = removeBtn.dataset.remove;
      if (!confirm("¿Quitar este gasto?")) return;
      state = { ...state, expenses: state.expenses.filter((x) => x.id !== id) };
      save(state);
      render();
      toast("Gasto eliminado");
      return;
    }
    const editBtn = e.target.closest("[data-edit]");
    if (editBtn) openEdit(editBtn.dataset.edit);
  });

  function openEdit(id) {
    const expense = state.expenses.find((x) => x.id === id);
    if (!expense) return;
    $("#edit-id").value = expense.id;
    $("#edit-amount").value = String(expense.amount).replace(".", ",");
    $("#edit-note").value = expense.note || "";
    $("#edit-date").value = dateKey(new Date(expense.createdAt));
    const sel = $("#edit-category");
    sel.innerHTML = CATEGORIES.map(
      (c) =>
        `<option value="${c.id}"${c.id === expense.category ? " selected" : ""}>${c.label}</option>`
    ).join("");
    $("#edit-error").hidden = true;
    syncDateInputs();
    addSheet.hidden = true;
    addSheet.classList.remove("open");
    openSheet(editSheet);
  }

  sheetBackdrop.addEventListener("click", closeSheets);
  $("#edit-cancel").addEventListener("click", closeSheets);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && (!addSheet.hidden || !editSheet.hidden)) closeSheets();
  });

  $("#edit-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const id = $("#edit-id").value;
    const amount = parseAmount($("#edit-amount").value);
    if (!Number.isFinite(amount) || amount <= 0) {
      $("#edit-error").hidden = false;
      $("#edit-error").textContent = "Importe no válido.";
      return;
    }
    const { min, max } = weekBoundsISO();
    const day = $("#edit-date").value;
    if (!day || day < min || day > max) {
      $("#edit-error").hidden = false;
      $("#edit-error").textContent = "La fecha debe estar en esta semana.";
      return;
    }
    const note = $("#edit-note").value.trim();
    const category = $("#edit-category").value;
    state = {
      ...state,
      expenses: state.expenses.map((x) =>
        x.id === id
          ? {
              ...x,
              amount,
              category,
              note: note || undefined,
              createdAt: new Date(`${day}T12:00:00`).toISOString(),
            }
          : x
      ),
    };
    save(state);
    closeSheets();
    render();
    toast("Gasto actualizado");
  });

  $("#btn-reset").addEventListener("click", () => {
    if (!state.budget && !state.expenses.length) {
      toast("Nada que reiniciar");
      return;
    }
    if (!confirm("¿Reiniciar la semana? Se borrarán el tope y todos los gastos actuales.")) {
      return;
    }
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch { /* ignore */ }
    state = emptyState();
    save(state);
    budgetCollapsed = false;
    budgetInput.value = "";
    expenseAmount.value = "";
    expenseNote.value = "";
    selectedCat = "comida";
    render();
    toast("Semana reiniciada");
    budgetInput.focus();
  });

  if (loaded.rolled) {
    weekRollover.hidden = false;
    weekRollover.textContent = "Nueva semana — fija el tope.";
    weekRollover.classList.add("warn");
  }

  if (state.budget != null && state.budget > 0) budgetCollapsed = true;
  render();
})();
  </script>
</body>
</html>
